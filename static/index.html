<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тетрадь · Репетитор ВПР и Олимпиад</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="notebook">

  <!-- ОБЛОЖКА / БОКОВАЯ ПАНЕЛЬ -->
  <aside class="cover">
    <div class="spiral" aria-hidden="true"></div>

    <div class="cover-inner">
      <div class="cover-title">
        <span class="cover-title__hand">Тетрадь</span>
        <span class="cover-title__sub">по подготовке</span>
      </div>

      <div class="field">
        <label class="field__label">01 · Предмет</label>
        <select id="subject" class="field__select">
          <option>Математика</option>
          <option>Русский язык</option>
          <option>Физика</option>
          <option>Химия</option>
          <option>Биология</option>
          <option>История</option>
          <option>Астрономия</option>
        </select>
      </div>

      <div class="field">
        <label class="field__label">02 · Формат</label>
        <div class="toggle" id="examToggle">
          <button type="button" class="toggle__btn is-active" data-value="ВПР">ВПР</button>
          <button type="button" class="toggle__btn" data-value="Олимпиада">Олимпиада</button>
        </div>
      </div>

      <div class="field">
        <label class="field__label">03 · Класс</label>
        <select id="grade" class="field__select"></select>
      </div>

      <button id="startBtn" class="start-btn">
        <span>Начать урок</span>
        <svg width="18" height="14" viewBox="0 0 18 14" fill="none"><path d="M1 7H17M17 7L11 1M17 7L11 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <p class="cover-note">Задания подстраиваются под класс и предмет. Можно менять их в любой момент — диалог начнётся заново.</p>
    </div>

    <div class="cover-footer">
      <span class="dot"></span> Groq · gpt-oss-120b
    </div>
  </aside>

  <!-- СТРАНИЦА ТЕТРАДИ -->
  <main class="page">
    <header class="page-head">
      <div class="page-head__title" id="pageTitle">Выбери предмет и класс слева, затем нажми «Начать урок»</div>
      <div class="page-head__meta" id="pageMeta"></div>
    </header>

    <div class="ruled" id="chat">
      <div class="empty-state" id="emptyState">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z" stroke="currentColor" stroke-width="1.5"/></svg>
        <p>Чистая страница ждёт первого задания.</p>
      </div>
    </div>

    <form class="composer" id="composer">
      <input type="text" id="input" class="composer__input" placeholder="Напиши ответ или вопрос…" autocomplete="off" disabled>
      <button type="submit" class="composer__send" id="sendBtn" disabled aria-label="Отправить">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </main>
</div>

<script src="/static/script.js"></script>
</body>
</html>
